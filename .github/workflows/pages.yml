name: Refresh and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate reports even if they are recent
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          node scripts/test-logic.mjs
          node scripts/test-app.mjs
          node scripts/test-catch.mjs
          node scripts/test-calculations.mjs
      - uses: actions/configure-pages@v5
        id: pages
      - name: Generate report and live data
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE_REFRESH: ${{ inputs.force }}
        run: node scripts/generate.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Open an issue if the refresh failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create refresh-failure --color B60205 --description "Scheduled refresh failed" 2>/dev/null || true
          if [ -z "$(gh issue list --label refresh-failure --state open --json number --jq '.[0].number')" ]; then
            gh issue create --label refresh-failure --title "Scheduled refresh failed" \
              --body "The scheduled refresh failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The site keeps serving the last good data. Close this issue after fixing; a new one opens on the next failure."
          fi
